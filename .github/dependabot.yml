version: 2
updates:
  # 1. GitHub Actions (Workflows e Reusable Actions)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(deps-dev)"
      include: "scope"
    # Ignora atualizações major automáticas para evitar tags/versões inexistentes
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # Agrupa as actions em um único PR para evitar spam de Pull Requests
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # 2. JavaScript / Node.js (npm via package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps-js)"
      include: "scope"
